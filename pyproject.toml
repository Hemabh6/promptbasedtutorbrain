[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tutorbrain"
version = "0.1.0"
description = "Reference implementation of the Prompt-Based Tutor Brain specification"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-jsonschema>=4.22",
]

[project.scripts]
tutorbrain = "tutorbrain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tutorbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["tutorbrain"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
